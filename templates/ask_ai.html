<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ask AI Doctor</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.png">

    <style>
        body {
            margin: 0;
            background: #0b0f1a;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .ai-chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #0f172a;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .ai-header {
            padding: 16px;
            background: linear-gradient(90deg,#1e293b,#020617);
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #1e293b;
        }

        .ai-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user-msg {
            align-self: flex-end;
            background: #2563eb;
        }

        .ai-msg {
            align-self: flex-start;
            background: #020617;
            border: 1px solid #1e293b;
        }

        .ai-input {
            display: flex;
            padding: 14px;
            border-top: 1px solid #1e293b;
            background: #020617;
        }

        .ai-input input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        .ai-input button {
            margin-left: 10px;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: #22c55e;
            color: black;
            font-weight: bold;
            transition: 0.2s;
        }

        .ai-input button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="ai-chat-container">

    <div class="ai-header">
        🧠 AI Medical Assistant (Diabetes AI)
    </div>

    <div class="ai-messages" id="chatBox">
        <div class="msg ai-msg">
            Hello 👋 I'm your AI medical assistant.  
            Ask me anything about diabetes.
        </div>
    </div>

    <div class="ai-input">
        <input type="text" id="userInput" placeholder="Ask a medical question..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
async function sendMessage(){
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();

    if(message === "") return;

    // User message
    const userDiv = document.createElement("div");
    userDiv.className = "msg user-msg";
    userDiv.innerText = message;
    chatBox.appendChild(userDiv);

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // AI loading
    const aiDiv = document.createElement("div");
    aiDiv.className = "msg ai-msg";
    aiDiv.innerText = "Thinking...";
    chatBox.appendChild(aiDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const formData = new FormData();
        formData.append("message", message);

        const response = await fetch("/api/ask-ai", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        // SAFETY CHECK
        if (data.reply) {
            aiDiv.innerText = data.reply;
        } else {
            aiDiv.innerText = "I'm here to help with diabetes-related questions 🩺. Please ask something about diabetes, blood sugar, or insulin.";
        }

    } catch (error) {
        aiDiv.innerText = "⚠️ Connection error. Please try again.";
        console.error(error);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
