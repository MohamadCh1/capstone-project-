<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ask AI Doctor</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/ask_ai.css">
</head>

<body>

<div class="ai-chat-container">

    <div class="ai-header">
        🧠 AI Medical Assistant (Diabetes AI)
    </div>

    <div class="ai-messages" id="chatBox">
        <div class="chat-bubble chat-bubble-ai">
            Hello 👋 I'm your AI medical assistant.
            Ask me anything about diabetes.
        </div>
    </div>

    <div class="ai-input">
        <input type="text" id="userInput" placeholder="Ask a medical question..." />
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
async function sendMessage(){
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const message = input.value.trim();

    if(message === "") return;

    // User message
    const userDiv = document.createElement("div");
    userDiv.className = "chat-bubble chat-bubble-user";
    userDiv.innerText = message;
    chatBox.appendChild(userDiv);

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // AI loading
    const aiDiv = document.createElement("div");
    aiDiv.className = "chat-bubble chat-bubble-ai";
    aiDiv.innerText = "Thinking...";
    chatBox.appendChild(aiDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const formData = new FormData();
        formData.append("message", message);

        const response = await fetch("/api/ask-ai", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        // SAFETY CHECK
        if (data.reply) {
            aiDiv.innerText = data.reply;
        } else {
            aiDiv.innerText = "I'm here to help with diabetes-related questions 🩺. Please ask something about diabetes, blood sugar, or insulin.";
        }

    } catch (error) {
        aiDiv.innerText = "⚠️ Connection error. Please try again.";
        console.error(error);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
