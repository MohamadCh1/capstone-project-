<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
    <link rel="stylesheet" href="/static/css/design-system.css?v=2">
    <link rel="stylesheet" href="/static/css/patient_register.css?v=2">
    <link rel="icon" type="image/x-icon" href="/static/favicon.png">
</head>
<body>
    <div class="form-container">
        <h1 style="margin: 5px;padding-bottom: 10px;">Patient Register</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="message">{{ message }}</div>
        {% endif %}

        <form method="post" action="/patient/register">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>

                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="">-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>

                    <label for="ethnicity">Ethnicity:</label>
                    <select id="ethnicity" name="ethnicity" required>
                        <option value="">-- Select Ethnicity --</option>
                        <option value="Mexican American">Mexican American</option>
                        <option value="Other Hispanic">Other Hispanic</option>
                        <option value="Non-Hispanic White">Non-Hispanic White</option>
                        <option value="Non-Hispanic Black">Non-Hispanic Black</option>
                        <option value="Other Race">Other Race</option>
                    </select>

                    <label for="doctor_email">Doctor Email:</label>
                    <input type="email" id="doctor_email" name="doctor_email" required>

                    <label for="email">Patient Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <!-- Device Info -->
                <div class="form-group">
                    <div class="device-block">
                        <h3>BMI Device</h3>
                        <div class="device-row">
                            <input type="text" name="bmi_manufacturer" placeholder="Manufacturer">
                            <input type="text" name="bmi_model" placeholder="Model">
                            <input type="text" name="bmi_serial" placeholder="Serial"
                                   pattern="[A-Za-z0-9\-]{6,20}"
                                   title="6–20 characters, letters, numbers, or dashes" required>
                        </div>
                    </div>

                    <div class="device-block">
                        <h3>HbA1c Device</h3>
                        <div class="device-row">
                            <input type="text" name="hba1c_manufacturer" placeholder="Manufacturer">
                            <input type="text" name="hba1c_model" placeholder="Model">
                            <input type="text" name="hba1c_serial" placeholder="Serial"
                                   pattern="[A-Za-z0-9\-]{6,20}"
                                   title="6–20 characters, letters, numbers, or dashes" required>
                        </div>
                    </div>

                    <div class="device-block">
                        <h3>Glucose Device</h3>
                        <div class="device-row">
                            <input type="text" name="glucose_manufacturer" placeholder="Manufacturer">
                            <input type="text" name="glucose_model" placeholder="Model">
                            <input type="text" name="glucose_serial" placeholder="Serial"
                                   pattern="[A-Za-z0-9\-]{6,20}"
                                   title="6–20 characters, letters, numbers, or dashes" required>
                        </div>
                    </div>

                    <div class="device-block">
                        <h3>Blood Pressure Device</h3>
                        <div class="device-row">
                            <input type="text" name="bp_manufacturer" placeholder="Manufacturer">
                            <input type="text" name="bp_model" placeholder="Model">
                            <input type="text" name="bp_serial" placeholder="Serial"
                                   pattern="[A-Za-z0-9\-]{6,20}"
                                   title="6–20 characters, letters, numbers, or dashes" required>
                        </div>
                    </div>

                    <div class="device-block">
                        <h3>Sleep & Activity Device</h3>
                        <div class="device-row">
                            <input type="text" name="sleep_manufacturer" placeholder="Manufacturer">
                            <input type="text" name="sleep_model" placeholder="Model">
                            <input type="text" name="sleep_serial" placeholder="Serial"
                                   pattern="[A-Za-z0-9\-]{6,20}"
                                   title="6–20 characters, letters, numbers, or dashes" required>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit">Register</button>
        </form>
        <!-- Link to doctor registration -->
        <div style="text-align: center; margin-top: 20px;display: flex;align-items: center;justify-content: space-around;">
            <a href="/doctor/register" class="switch-link">Register as a Doctor Instead!</a>
            <a href="/home" class="switch-link">Go back to the Home Page!</a>
        </div>
    </div>
</body>
</html>
